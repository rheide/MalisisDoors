buildscript {
    repositories { maven { url = 'https://maven.minecraftforge.net/' }; mavenCentral() }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:3.0.197' }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
version = '1.12.2-8.0.0'
group = 'net.malisis'
archivesBaseName = 'malisisdoors-compat'
sourceCompatibility = targetCompatibility = '1.8'
minecraft { mappings channel: 'snapshot', version: '20171003-1.12' }
repositories { maven { url = uri('../vendor') }; mavenCentral() }
dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'
    compile fg.deobf('net.malisis:malisiscore:1.12.2-6.5.1')
}
processResources {
    inputs.property 'version', project.version
    from(sourceSets.main.resources.srcDirs) { include 'mcmod.info'; expand version: project.version, mcversion: '1.12.2' }
    from(sourceSets.main.resources.srcDirs) { exclude 'mcmod.info' }
}
jar {
    from('LICENSE.txt')
    manifest { attributes 'Implementation-Title': 'MalisisDoors', 'Implementation-Version': project.version, 'Implementation-Vendor': 'Ordinastie; community performance continuation' }
}
jar.finalizedBy('reobfJar')
task writeBenchmarkClasspath {
    dependsOn classes
    doLast { file('../benchmark-classpath.txt').text = sourceSets.main.runtimeClasspath.asPath }
}
task compileAnimationChecks(type: JavaCompile) {
    dependsOn classes
    source = fileTree('src/testsupport/java') { include '**/*.java' }
    classpath = sourceSets.main.runtimeClasspath
    destinationDir = file("$buildDir/animation-checks/classes")
    sourceCompatibility = targetCompatibility = '1.8'
    options.compilerArgs += ['-proc:none']
}
task testAnimationPlans(type: JavaExec) {
    dependsOn compileAnimationChecks
    classpath = sourceSets.main.runtimeClasspath + files(compileAnimationChecks.destinationDir)
    main = 'net.malisis.doors.checks.AnimationPlanChecks'
    args file('src/main/java/net/malisis/doors/movement').absolutePath
}
check.dependsOn testAnimationPlans

task testGarageTopology(type: JavaExec) {
    dependsOn compileAnimationChecks
    classpath = sourceSets.main.runtimeClasspath + files(compileAnimationChecks.destinationDir)
    main = 'net.malisis.doors.checks.GarageTopologyChecks'
}
check.dependsOn testGarageTopology
